name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install / update dependencies
        run: |
          cd /opt/oxypc
          source venv/bin/activate
          pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Copy updated files
        run: |
          rsync -a --exclude='.git' --exclude='venv' --exclude='.env' \
                --exclude='*.pyc' --exclude='__pycache__' \
                $GITHUB_WORKSPACE/ /opt/oxypc/

      - name: Run database migrations
        run: |
          cd /opt/oxypc
          source venv/bin/activate
          # Apply any real Alembic migrations first (non-fatal if none/unstamped).
          alembic upgrade head || echo "alembic upgrade skipped (no migrations or unstamped) — schema provisioner will reconcile"

      - name: Provision / reconcile schema (additive auto-fix)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd /opt/oxypc
          source venv/bin/activate
          # This project evolves the schema via the additive-column auto-provisioner
          # (db_validator.validate_and_fix), NOT hand-written Alembic migrations.
          # Force-run that provisioner (auto_fix=True) so every new table/column
          # added since the last deploy is created on production, regardless of the
          # OXYPC_AUTO_FIX runtime flag. Without this, a new model column ships in
          # code but is missing in the prod DB → 500 on any page that reads it.
          python -c "import asyncio; from database import engine; from db_validator import validate_and_fix; s = asyncio.run(validate_and_fix(engine, auto_fix=True)); print('[schema] auto-fixed', s['issues_fixed'], 'issue(s):', s.get('fixed', []))"

      - name: Restart app
        run: systemctl restart oxypc

      - name: Health check
        run: |
          sleep 3
          curl -sf http://127.0.0.1:8000/health || curl -sf http://127.0.0.1:8000/ || exit 1
