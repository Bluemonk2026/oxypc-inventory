# OxyPC Inventory — INTERNAL LAN vhost (staff only, plain HTTP)
#
# This is the config running on the on-premise app server (10.199.206.109),
# where staff reach the app by IP over the office LAN and there is no TLS.
# For the public/VPS deployment with a real hostname and Let's Encrypt, use
# nginx-oxypc.conf instead — the two are NOT interchangeable, see the
# X-Forwarded-Proto note below.
#
#   sudo cp deploy/nginx-oxypc-internal.conf /etc/nginx/sites-available/oxypc
#   sudo ln -sfn /etc/nginx/sites-available/oxypc /etc/nginx/sites-enabled/oxypc
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # ── DELIBERATE: this vhost does NOT set X-Forwarded-Proto ────────────────
    # main.py's _force_https middleware redirects to https whenever that header
    # resolves to "http". On a box with no TLS listener that bounces every staff
    # browser to an https:// URL which refuses to connect — the whole app looks
    # dead. The middleware is a deliberate no-op when the header is ABSENT, so
    # omitting it is what keeps plain-HTTP LAN access working.
    # The future public dealer vhost MUST set it to "https".

    # ── gzip ────────────────────────────────────────────────────────────────
    # The app compresses its own responses, so this is not about page HTML.
    # It matters because the /static/ block below serves files straight off
    # disk, bypassing the app entirely — without this, those assets would go
    # out uncompressed. nginx's stock gzip_types covers text/html ONLY.
    # woff/woff2 are deliberately absent: already compressed, re-gzipping
    # burns CPU for no gain.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml
                      application/javascript application/json
                      application/xml image/svg+xml;

    # ── Static assets served by nginx, not Python ───────────────────────────
    # base.html references 11 static files. Previously every one was proxied
    # through a uvicorn worker on every page load — occupying workers that
    # should be rendering pages — and with no cache headers, so browsers
    # re-fetched all 11 on every single navigation.
    # Measured on 10.199.206.109: bootstrap.min.css 30.3ms -> 10.7ms,
    # chart.umd.min.js 40.1ms -> 18.4ms, app.js 8.0ms -> 0.8ms.
    location /static/ {
        alias /opt/oxypc/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # Larger buffers: some list pages render multi-MB HTML responses.
        proxy_buffering    on;
        proxy_buffers      16 64k;
        proxy_buffer_size  64k;
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
