<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OxyPC Trade Partner{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #f4f6f9; padding-bottom: 70px; }
    .tp-topbar { background: linear-gradient(135deg, #1a56db 0%, #0d3b8c 100%); }
    .tp-bottomnav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1030;
      background: #fff; border-top: 1px solid #dee2e6;
      display: flex; justify-content: space-around; padding: .4rem 0;
    }
    .tp-bottomnav a { color: #6c757d; text-decoration: none; font-size: .72rem; text-align: center; }
    .tp-bottomnav a.active { color: #1a56db; font-weight: 600; }
    .tp-bottomnav i { display: block; font-size: 1.25rem; }
    .listing-card { border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); border-radius: 10px; }
  </style>
</head>
<body>
<nav class="tp-topbar text-white px-3 py-2 d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center gap-2">
    <i class="bi bi-laptop fs-4"></i>
    <div>
      <div class="fw-bold" style="line-height:1">OxyPC Trade Partner</div>
      {% if dealer %}<small class="text-white-50">{{ dealer.business_name }}</small>{% endif %}
    </div>
  </div>
  {% if dealer %}
  <form method="post" action="/partner/logout" class="m-0">
    <input type="hidden" name="csrf_token" value="{{ partner_csrf }}">
    <button class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i></button>
  </form>
  {% endif %}
</nav>

<main class="container-fluid px-3 py-3" style="max-width: 720px; margin: 0 auto;">
  {% block content %}{% endblock %}
</main>

{% if dealer %}
<nav class="tp-bottomnav">
  <a href="/partner/catalog" class="{% if request.url.path.startswith('/partner/catalog') or request.url.path.startswith('/partner/listings') %}active{% endif %}">
    <i class="bi bi-grid"></i>Catalog
  </a>
  <a href="/partner/bookings" class="{% if request.url.path.startswith('/partner/bookings') %}active{% endif %}">
    <i class="bi bi-bookmark-check"></i>My Bookings
  </a>
  <a href="/partner/profile" class="{% if request.url.path.startswith('/partner/profile') %}active{% endif %}">
    <i class="bi bi-person"></i>Profile
  </a>
</nav>
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
